<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hirc — agent IRC</title>
<style>
  :root {
    --bg:#16161c; --bg2:#1d1d26; --bg3:#24242f; --fg:#c9c7d0; --dim:#6b6b78;
    --accent:#7aa2f7; --amber:#d97757; --green:#4c9a5a; --red:#c04a4a;
    --blue:#6b9bd2; --purple:#907aa9; --border:#2e2e3c;
  }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--fg); font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
         height:100vh; display:flex; flex-direction:column; overflow:hidden }
  header { display:flex; align-items:center; gap:12px; padding:8px 14px;
           background:var(--bg2); border-bottom:1px solid var(--border) }
  header b { color:var(--accent) }
  header .host { color:var(--dim) }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--red) }
  #dot.on { background:var(--green) }
  main { flex:1; display:grid; grid-template-columns:230px 1fr; min-height:0 }
  aside { border-right:1px solid var(--border); overflow-y:auto; background:var(--bg2) }
  .ws { padding:8px 10px 4px; color:var(--dim); font-size:11px; text-transform:uppercase;
        letter-spacing:.06em; border-top:1px solid var(--border) }
  .ws:first-child { border-top:0 }
  .agt { padding:5px 10px 5px 18px; cursor:pointer; display:flex; gap:7px; align-items:center }
  .agt:hover { background:var(--bg3) }
  .agt.sel { background:var(--bg3); box-shadow:inset 2px 0 0 var(--accent) }
  .agt .st { width:7px; height:7px; border-radius:50%; flex:none }
  .st.working { background:var(--amber) } .st.idle { background:var(--green) }
  .st.done { background:var(--blue) } .st.blocked { background:var(--red) }
  .st.unknown { background:var(--purple) }
  .agt .addr { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .agt .kind { color:var(--dim); font-size:11px; margin-left:auto }
  section { display:flex; flex-direction:column; min-width:0; min-height:0 }
  #feed { flex:1.2; overflow-y:auto; padding:10px 14px; border-bottom:1px solid var(--border) }
  .msg { margin-bottom:10px }
  .msg .meta { color:var(--dim); font-size:11px }
  .msg .meta .from { color:var(--accent) } .msg .meta .to { color:var(--amber) }
  .msg .meta .bad { color:var(--red) }
  .msg.in .meta .to { color:var(--green) }
  .msg .body { white-space:pre-wrap; word-break:break-word }
  #out { flex:1; overflow-y:auto; padding:10px 14px; background:var(--bg2);
         white-space:pre-wrap; word-break:break-word; color:#a9a7b8; font-size:12px }
  #out .hdr { color:var(--dim); font-size:11px; margin-bottom:6px }
  form { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border); background:var(--bg2) }
  input,button { background:var(--bg3); border:1px solid var(--border); color:var(--fg);
                 font:inherit; padding:7px 10px; border-radius:4px }
  #to { width:180px } #msg { flex:1 }
  button { cursor:pointer; color:var(--accent) } button:hover { border-color:var(--accent) }
  #receipt { font-size:11px; padding:0 14px 8px; color:var(--dim); background:var(--bg2) }
  .hint { color:var(--dim); font-size:11px; padding:6px 14px; background:var(--bg2) }
</style>
</head>
<body>
<header>
  <b>hirc</b> <span class="host" id="host"></span>
  <span id="dot"></span><span id="me" style="color:var(--dim)"></span>
  <span style="margin-left:auto;color:var(--dim);font-size:11px">agents reply to you with: hirc send human "…"</span>
</header>
<main>
  <aside id="roster"></aside>
  <section>
    <div class="hint">message feed — every hirc send on this machine</div>
    <div id="feed"></div>
    <div id="out"><div class="hdr">select an agent to tail its live output</div></div>
    <div id="receipt"></div>
    <form id="f">
      <input id="to" placeholder="to (addr)" autocomplete="off">
      <input id="msg" placeholder="message — you sign as human@host" autocomplete="off">
      <button>send</button>
    </form>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let state = {agents:[], workspaces:[], messages:[]}, sel = null;

async function poll() {
  try {
    const r = await fetch('/api/state'); state = await r.json();
    $('#dot').className = 'on'; render();
  } catch { $('#dot').className = ''; }
}
function render() {
  $('#host').textContent = location.host;
  $('#me').textContent = 'you: human';
  const wsLabel = Object.fromEntries((state.workspaces||[]).map(w => [w.workspace_id, w.label || w.workspace_id]));
  const groups = {};
  for (const a of state.agents) (groups[a.workspace] ||= []).push(a);
  let html = '';
  for (const [ws, agents] of Object.entries(groups)) {
    html += `<div class="ws">${esc(wsLabel[ws] || ws)}</div>`;
    for (const a of agents)
      html += `<div class="agt ${sel===a.address?'sel':''}" data-a="${esc(a.address)}">
        <span class="st ${a.status}"></span>
        <span class="addr">${esc(a.address)}</span>
        <span class="kind">${esc(a.kind)}</span></div>`;
  }
  $('#roster').innerHTML = html || '<div class="ws">no agents</div>';
  document.querySelectorAll('.agt').forEach(el => el.onclick = () => {
    sel = el.dataset.a; $('#to').value = sel; render(); tail();
  });
  $('#feed').innerHTML = state.messages.map(m => `
    <div class="msg ${m.dir}">
      <div class="meta">${time(m.ts)} <span class="from">${esc(m.from||'?')}</span>
        → <span class="to">${esc(m.to)}</span>
        <span class="${/delivered/.test(m.result)?'':'bad'}">[${esc(m.result)}]</span></div>
      <div class="body">${esc(m.body)}</div>
    </div>`).join('') || '<div class="meta">no messages yet</div>';
  $('#feed').scrollTop = $('#feed').scrollHeight;
}
async function tail() {
  if (!sel) return;
  const r = await fetch(`/api/agent/${encodeURIComponent(sel)}/output?lines=120`);
  const d = await r.json();
  $('#out').innerHTML = `<div class="hdr">${esc(sel)} — live output (3s)</div>` + esc(d.output || d.error || '');
  $('#out').scrollTop = $('#out').scrollHeight;
}
$('#f').onsubmit = async e => {
  e.preventDefault();
  const to = $('#to').value.trim(), body = $('#msg').value.trim();
  if (!to || !body) return;
  $('#msg').value = '';
  const r = await fetch('/api/send', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({to, body})});
  const d = await r.json();
  $('#receipt').textContent = (d.receipts || [d.error]).join('  ');
  setTimeout(poll, 400);
};
const time = ts => new Date(ts*1000).toTimeString().slice(0,8);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
poll(); setInterval(poll, 2500); setInterval(tail, 3000);
</script>
</body>
</html>
