<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hirc — agent IRC</title>
<style>
  :root {
    --bg:#16161c; --bg2:#1d1d26; --bg3:#24242f; --fg:#c9c7d0; --dim:#6b6b78;
    --accent:#7aa2f7; --amber:#d97757; --green:#4c9a5a; --red:#c04a4a;
    --blue:#6b9bd2; --purple:#907aa9; --border:#2e2e3c;
  }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--fg); font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
         height:100vh; display:flex; flex-direction:column; overflow:hidden }
  header { display:flex; align-items:center; gap:12px; padding:8px 14px;
           background:var(--bg2); border-bottom:1px solid var(--border) }
  header b { color:var(--accent); font-size:15px }
  .host { color:var(--dim) }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--red) }
  #dot.on { background:var(--green) }
  #blocked { display:none; background:var(--red); color:#fff; padding:1px 8px;
             border-radius:10px; font-size:11px; font-weight:bold }
  #bell { margin-left:auto; background:none; border:1px solid var(--border); color:var(--dim);
          border-radius:4px; padding:3px 8px; cursor:pointer; font:inherit }
  #bell.on { color:var(--amber); border-color:var(--amber) }
  main { flex:1; display:grid; grid-template-columns:250px 1fr; min-height:0 }
  aside { border-right:1px solid var(--border); overflow-y:auto; background:var(--bg2) }
  .ws { padding:9px 10px 4px; color:var(--dim); font-size:10px; text-transform:uppercase;
        letter-spacing:.07em; border-top:1px solid var(--border); display:flex; gap:6px }
  .ws:first-child { border-top:0 }
  .ws .focus { color:var(--accent) }
  .agt { padding:6px 10px; cursor:pointer; display:flex; gap:8px; align-items:center }
  .agt:hover { background:var(--bg3) }
  .agt.sel { background:var(--bg3); box-shadow:inset 2px 0 0 var(--accent) }
  .badge { width:22px; height:22px; border-radius:5px; display:flex; flex:none;
           align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#fff }
  .badge img { width:15px; height:15px; filter:brightness(0) invert(1) }
  .agt .mid { min-width:0; flex:1 }
  .agt .addr { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .agt .sub { color:var(--dim); font-size:10px; display:flex; gap:5px; align-items:center }
  .st { width:6px; height:6px; border-radius:50%; display:inline-block }
  .st.working { background:var(--amber); animation:pulse 1.2s infinite }
  .st.idle { background:var(--green) } .st.done { background:var(--blue) }
  .st.blocked { background:var(--red) } .st.unknown { background:var(--purple) }
  @keyframes pulse { 50% { opacity:.35 } }
  .unread { background:var(--accent); color:#fff; border-radius:9px; font-size:10px;
            padding:0 6px; font-weight:bold }
  section { display:flex; flex-direction:column; min-width:0; min-height:0 }
  #chips { display:flex; gap:6px; padding:7px 14px; background:var(--bg2);
           border-bottom:1px solid var(--border); overflow-x:auto; flex:none }
  .chip { border:1px solid var(--border); border-radius:11px; padding:2px 10px;
          font-size:11px; color:var(--dim); cursor:pointer; white-space:nowrap }
  .chip:hover { color:var(--fg) } .chip.on { color:var(--accent); border-color:var(--accent) }
  #feed { flex:1.15; overflow-y:auto; padding:10px 14px; border-bottom:1px solid var(--border) }
  .msg { margin-bottom:10px }
  .msg .meta { color:var(--dim); font-size:11px }
  .msg .meta .from { color:var(--accent) } .msg .meta .to { color:var(--amber) }
  .msg .meta .bad { color:var(--red) }
  .msg.in .meta .to { color:var(--green) }
  .msg .body { white-space:pre-wrap; word-break:break-word }
  #out { flex:1; overflow-y:auto; padding:10px 14px; background:var(--bg2);
         white-space:pre-wrap; word-break:break-word; color:#a9a7b8; font-size:12px }
  #out .hdr { color:var(--dim); font-size:11px; margin-bottom:6px }
  form { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border); background:var(--bg2) }
  input,button { background:var(--bg3); border:1px solid var(--border); color:var(--fg);
                 font:inherit; padding:7px 10px; border-radius:4px }
  #to { width:190px } #msg { flex:1 }
  form button { cursor:pointer; color:var(--accent) } form button:hover { border-color:var(--accent) }
  #receipt { font-size:11px; padding:0 14px 8px; color:var(--dim); background:var(--bg2) }
</style>
</head>
<body>
<header>
  <b>hirc</b> <span class="host" id="host"></span>
  <span id="dot"></span><span style="color:var(--dim)">you: human</span>
  <span id="blocked"></span>
  <button id="bell" title="browser notifications for messages to human">🔕</button>
</header>
<main>
  <aside id="roster"></aside>
  <section>
    <div id="chips"></div>
    <div id="feed"></div>
    <div id="out"><div class="hdr">select an agent to tail its live output</div></div>
    <div id="receipt"></div>
    <form id="f">
      <input id="to" list="addrs" placeholder="to (addr)" autocomplete="off">
      <datalist id="addrs"></datalist>
      <input id="msg" placeholder="message — you sign as human@host" autocomplete="off">
      <button>send</button>
    </form>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const KIND = {
  claude:['#d97757','Cl'], codex:['#565869','Cx'], devin:['#7aa2f7','Dv'],
  gemini:['#4285f4','Ge'], kimi:['#1783ff','Km'], kiro:['#9046ff','Kr'],
  qwen:['#615ced','Qw'], deepseek:['#4d6bfe','Ds'], opencode:['#6b9bd2','Oc'],
  cline:['#586876','Cn'], kilo:['#9a9808','Kl'], amp:['#c98a1f','Am'],
  grok:['#444','Gk'], copilot:['#2da44e','Cp'], pi:['#4c9a5a','Pi'],
  omp:['#b5559d','Om'], gemini_cli:['#4285f4','Ge'], human:['#4c9a5a','Hu'],
};
const badge = k => { const [c,l] = KIND[k] || ['#3a3a48', (k||'?').slice(0,2)];
  return `<span class="badge" style="background:${c}"><img src="/icons/${esc(k)}.svg" alt="" onerror="this.outerHTML='${esc(l)}'"></span>`; };

let state = {agents:[], workspaces:[], messages:[]};
let sel = localStorage.hircSel || null;
let filter = localStorage.hircFilter || 'all';
let lastSeen = JSON.parse(localStorage.hircSeen || '{}');
let seenCount = +(localStorage.hircCount || 0);
let notify = localStorage.hircNotify === '1';
$('#bell').className = notify ? 'on' : ''; $('#bell').textContent = notify ? '🔔' : '🔕';
$('#bell').onclick = async () => {
  notify = !notify;
  if (notify && Notification.permission !== 'granted')
    notify = (await Notification.requestPermission()) === 'granted';
  localStorage.hircNotify = notify ? '1' : '0';
  $('#bell').className = notify ? 'on' : ''; $('#bell').textContent = notify ? '🔔' : '🔕';
};

const pairKey = m => {
  const a = m.from || '?', b = m.to;
  return m.to === 'human' ? `${a}→human` : [a, b].sort().join('↔');
};

async function poll() {
  try {
    const r = await fetch('/api/state'); const d = await r.json();
    if (d.messages.length > seenCount && notify && Notification.permission === 'granted') {
      const fresh = d.messages.slice(seenCount).filter(m => m.to === 'human');
      for (const m of fresh) new Notification(`hirc · ${m.from}`, {body: m.body.slice(0, 120)});
    }
    seenCount = Math.max(seenCount, d.messages.length);
    localStorage.hircCount = seenCount;
    state = d; $('#dot').className = 'on'; render();
  } catch { $('#dot').className = ''; }
}

function unreadFor(addr) {
  const seen = lastSeen[addr] || 0;
  return state.messages.filter(m => m.ts > seen && (m.from === addr || m.to === addr)).length;
}

function render() {
  $('#host').textContent = location.host;
  const nBlocked = state.agents.filter(a => a.status === 'blocked').length;
  $('#blocked').style.display = nBlocked ? '' : 'none';
  $('#blocked').textContent = `${nBlocked} blocked`;

  const wsLabel = Object.fromEntries((state.workspaces||[]).map(w => [w.workspace_id, w.label || w.workspace_id]));
  const groups = {};
  for (const a of state.agents) (groups[a.workspace] ||= []).push(a);
  const rank = {blocked:0, working:1, unknown:2, idle:3, done:4};
  let html = '';
  for (const [ws, agents] of Object.entries(groups)) {
    const focused = (state.workspaces||[]).find(w => w.workspace_id === ws)?.focused;
    html += `<div class="ws">${esc(wsLabel[ws] || ws)}${focused ? '<span class="focus">●</span>' : ''}</div>`;
    agents.sort((x, y) => (rank[x.status] ?? 5) - (rank[y.status] ?? 5));
    for (const a of agents) {
      const u = unreadFor(a.address);
      html += `<div class="agt ${sel===a.address?'sel':''}" data-a="${esc(a.address)}">
        ${badge(a.kind)}
        <span class="mid"><span class="addr">${esc(a.address)}</span>
        <span class="sub"><span class="st ${a.status}"></span>${a.status}</span></span>
        ${u ? `<span class="unread">${u}</span>` : ''}</div>`;
    }
  }
  $('#roster').innerHTML = html || '<div class="ws">no agents</div>';
  document.querySelectorAll('.agt').forEach(el => el.onclick = () => {
    sel = el.dataset.a; localStorage.hircSel = sel;
    $('#to').value = sel; lastSeen[sel] = now(); localStorage.hircSeen = JSON.stringify(lastSeen);
    render(); tail();
  });

  // conversation chips
  const pairs = [...new Set(state.messages
    .filter(m => /delivered/.test(m.result)).map(pairKey))].slice(-12);
  $('#chips').innerHTML = ['all', ...pairs].map(p =>
    `<span class="chip ${filter===p?'on':''}" data-p="${esc(p)}">${esc(p)}</span>`).join('');
  document.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    filter = el.dataset.p; localStorage.hircFilter = filter; render();
  });

  const msgs = filter === 'all' ? state.messages : state.messages.filter(m => pairKey(m) === filter);
  $('#feed').innerHTML = msgs.map(m => `
    <div class="msg ${m.dir}">
      <div class="meta">${time(m.ts)} <span class="from">${esc(m.from||'?')}</span>
        → <span class="to">${esc(m.to)}</span>
        <span class="${/delivered/.test(m.result)?'':'bad'}">[${esc(m.result)}]</span></div>
      <div class="body">${esc(m.body)}</div>
    </div>`).join('') || '<div class="meta">no messages yet</div>';
  $('#feed').scrollTop = $('#feed').scrollHeight;

  $('#addrs').innerHTML = ['all', 'human', ...state.agents.map(a => a.address)]
    .map(a => `<option value="${esc(a)}">`).join('');
  document.title = `hirc${nBlocked ? ` (${nBlocked} blocked)` : ''}`;
}

async function tail() {
  if (!sel) return;
  const r = await fetch(`/api/agent/${encodeURIComponent(sel)}/output?lines=120`);
  const d = await r.json();
  $('#out').innerHTML = `<div class="hdr">${esc(sel)} — live output (3s)</div>` + esc(d.output || d.error || '');
  $('#out').scrollTop = $('#out').scrollHeight;
}

$('#f').onsubmit = async e => {
  e.preventDefault();
  const to = $('#to').value.trim(), body = $('#msg').value.trim();
  if (!to || !body) return;
  $('#msg').value = '';
  const r = await fetch('/api/send', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({to, body})});
  const d = await r.json();
  $('#receipt').textContent = (d.receipts || [d.error]).join('  ');
  setTimeout(poll, 400);
};
const now = () => Math.floor(Date.now()/1000);
const time = ts => new Date(ts*1000).toTimeString().slice(0,8);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
poll(); setInterval(poll, 2500); setInterval(tail, 3000);
</script>
</body>
</html>
