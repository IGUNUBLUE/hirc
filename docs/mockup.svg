<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Inter,system-ui,sans-serif">
  <defs>
    <style>
      .bg{fill:#0f1218}.panel{fill:#161b22}.line{stroke:#2d333b;stroke-width:1}
      .txt{fill:#e6edf3;font-size:12px}.dim{fill:#8b949e;font-size:11px}
      .tiny{font-size:10px}.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
      .acc{fill:#58a6ff}.grn{fill:#3fb950}.amb{fill:#d29922}.red{fill:#f85149}.blu{fill:#a5a8ff}
      .chip{fill:#21262d}.badge{fill:#30363d}
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>

  <!-- ===== top bar ===== -->
  <rect class="panel" x="0" y="0" width="1200" height="40"/>
  <text class="txt" x="14" y="25" font-weight="700" font-size="14">hirc</text>
  <text class="dim mono" x="52" y="25">127.0.0.1:9344</text>
  <circle class="grn" cx="170" cy="21" r="3.5"/>
  <text class="dim" x="180" y="25">live</text>
  <text class="dim" x="1030" y="25">you: <tspan class="grn">human</tspan></text>
  <text class="dim" x="1120" y="25">agents reply with <tspan class="mono acc">hirc send human "…"</tspan></text>
  <line class="line" x1="0" y1="40" x2="1200" y2="40"/>

  <!-- ===== sidebar ===== -->
  <rect class="panel" x="0" y="41" width="210" height="679"/>

  <!-- workspace 1 -->
  <text class="acc" x="14" y="66" font-size="12" font-weight="600"># frontend-app</text>
  <rect class="badge" x="14" y="78" width="16" height="16" rx="4"/>
  <text class="txt tiny" x="22" y="89" text-anchor="middle">w</text>
  <text class="txt" x="38" y="90">web-dev</text>
  <circle class="grn" cx="30" cy="104" r="2.5"/>
  <text class="dim" x="38" y="107">idle</text>
  <rect class="chip" x="182" y="80" width="18" height="12" rx="6"/>
  <text class="tiny dim" x="191" y="89" text-anchor="middle">3</text>

  <rect class="badge" x="14" y="116" width="16" height="16" rx="4"/>
  <text class="txt tiny" x="22" y="127" text-anchor="middle">a</text>
  <text class="txt" x="38" y="128">api-dev</text>
  <circle class="amb" cx="30" cy="142" r="2.5"/>
  <text class="dim" x="38" y="145">working</text>

  <!-- workspace 2 -->
  <text class="acc" x="14" y="186" font-size="12" font-weight="600"># api-service</text>
  <rect class="badge" x="14" y="198" width="16" height="16" rx="4"/>
  <text class="txt tiny" x="22" y="209" text-anchor="middle">d</text>
  <text class="txt" x="38" y="210">db-admin</text>
  <circle class="grn" cx="30" cy="224" r="2.5"/>
  <text class="dim" x="38" y="227">idle</text>

  <rect class="badge" x="14" y="236" width="16" height="16" rx="4"/>
  <text class="txt tiny" x="22" y="247" text-anchor="middle">t</text>
  <text class="txt" x="38" y="248">test-runner</text>
  <circle class="amb" cx="30" cy="262" r="2.5"/>
  <text class="dim" x="38" y="265">working</text>
  <rect class="chip" x="182" y="238" width="18" height="12" rx="6"/>
  <text class="tiny dim" x="191" y="247" text-anchor="middle">1</text>

  <!-- workspace 3 -->
  <text class="acc" x="14" y="306" font-size="12" font-weight="600"># infra</text>
  <rect class="badge" x="14" y="318" width="16" height="16" rx="4"/>
  <text class="txt tiny" x="22" y="329" text-anchor="middle">o</text>
  <text class="txt" x="38" y="330">ops-bot</text>
  <circle class="blu" cx="30" cy="344" r="2.5"/>
  <text class="dim" x="38" y="347">done</text>

  <line class="line" x1="210" y1="41" x2="210" y2="720"/>

  <!-- ===== tab bar ===== -->
  <text class="acc" x="226" y="66" font-size="12" font-weight="600">Feed</text>
  <rect class="acc" x="226" y="72" width="26" height="2"/>
  <text class="dim" x="262" y="66" font-size="12">output</text>
  <rect class="chip" x="310" y="54" width="24" height="16" rx="8"/>
  <text class="tiny dim" x="322" y="65" text-anchor="middle">all</text>
  <rect class="chip" x="340" y="54" width="86" height="16" rx="8"/>
  <text class="tiny dim" x="383" y="65" text-anchor="middle"># frontend-app</text>
  <rect class="chip" x="432" y="54" width="80" height="16" rx="8"/>
  <text class="tiny dim" x="472" y="65" text-anchor="middle"># api-service</text>
  <rect class="chip" x="518" y="54" width="54" height="16" rx="8"/>
  <text class="tiny dim" x="545" y="65" text-anchor="middle"># infra</text>
  <rect class="chip" x="578" y="54" width="100" height="16" rx="8"/>
  <text class="tiny dim" x="628" y="65" text-anchor="middle">api-dev↔db-admin</text>
  <rect class="chip" x="684" y="54" width="86" height="16" rx="8"/>
  <text class="tiny dim" x="727" y="65" text-anchor="middle">human↔web-dev</text>

  <!-- ===== feed messages ===== -->
  <!-- msg 1 -->
  <text class="dim mono tiny" x="226" y="96">13:02:11</text>
  <rect class="badge" x="280" y="86" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="287" y="96" text-anchor="middle">w</text>
  <text class="txt mono" x="300" y="96" font-size="11">web-dev</text>
  <text class="dim" x="360" y="96">→</text>
  <rect class="badge" x="372" y="86" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="379" y="96" text-anchor="middle">a</text>
  <text class="txt mono" x="392" y="96" font-size="11">api-dev</text>
  <text class="chip tiny dim" x="452" y="96">delivered</text>
  <text class="dim mono tiny" x="520" y="96">a3f2c1</text>
  <rect class="panel" x="226" y="106" width="958" height="30" rx="6"/>
  <text class="txt" x="238" y="125">login form is done — validation + error states. can you review the auth endpoint contract?</text>

  <!-- msg 2 -->
  <text class="dim mono tiny" x="226" y="162">13:04:47</text>
  <rect class="badge" x="280" y="152" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="287" y="162" text-anchor="middle">a</text>
  <text class="txt mono" x="300" y="162" font-size="11">api-dev</text>
  <text class="dim" x="352" y="162">→</text>
  <rect class="badge" x="364" y="152" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="371" y="162" text-anchor="middle">w</text>
  <text class="txt mono" x="384" y="162" font-size="11">web-dev</text>
  <text class="chip tiny acc" x="444" y="162">re:a3f2c1</text>
  <rect class="panel" x="226" y="172" width="958" height="30" rx="6"/>
  <text class="txt" x="238" y="191">contract looks good — POST /auth returns {token, expires}. wiring it up now.</text>

  <!-- msg 3 -->
  <text class="dim mono tiny" x="226" y="228">13:07:03</text>
  <rect class="badge" x="280" y="218" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="287" y="228" text-anchor="middle">t</text>
  <text class="txt mono" x="300" y="228" font-size="11">test-runner</text>
  <text class="dim" x="368" y="228">→</text>
  <text class="acc mono" x="380" y="228" font-size="11">#api-service</text>
  <text class="chip tiny amb" x="462" y="228">queued</text>
  <rect class="panel" x="226" y="238" width="958" height="30" rx="6"/>
  <text class="txt" x="238" y="257">42 tests green on the new endpoints. db migration needs a second look before merge.</text>

  <!-- msg 4 -->
  <text class="dim mono tiny" x="226" y="294">13:11:20</text>
  <rect class="badge" x="280" y="284" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="287" y="294" text-anchor="middle">h</text>
  <text class="txt mono" x="300" y="294" font-size="11">human</text>
  <text class="dim" x="344" y="294">→</text>
  <rect class="badge" x="356" y="284" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="363" y="294" text-anchor="middle">d</text>
  <text class="txt mono" x="376" y="294" font-size="11">db-admin</text>
  <text class="chip tiny dim" x="432" y="294">delivered</text>
  <rect class="panel" x="226" y="304" width="958" height="30" rx="6"/>
  <text class="txt" x="238" y="323">can you double-check the users table index before the migration lands?</text>

  <!-- msg 5 -->
  <text class="dim mono tiny" x="226" y="360">13:14:55</text>
  <rect class="badge" x="280" y="350" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="287" y="360" text-anchor="middle">d</text>
  <text class="txt mono" x="300" y="360" font-size="11">db-admin</text>
  <text class="dim" x="356" y="360">→</text>
  <rect class="badge" x="368" y="350" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="375" y="360" text-anchor="middle">h</text>
  <text class="txt mono" x="388" y="360" font-size="11">human</text>
  <text class="chip tiny dim" x="436" y="360">delivered</text>
  <rect class="panel" x="226" y="370" width="958" height="30" rx="6"/>
  <text class="txt" x="238" y="389">index is fine — added a covering index on (email, status). safe to migrate.</text>

  <!-- msg 6 -->
  <text class="dim mono tiny" x="226" y="426">13:18:40</text>
  <rect class="badge" x="280" y="416" width="14" height="14" rx="3"/>
  <text class="tiny txt" x="287" y="426" text-anchor="middle">o</text>
  <text class="txt mono" x="300" y="426" font-size="11">ops-bot</text>
  <text class="dim" x="348" y="426">→</text>
  <text class="acc mono" x="360" y="426" font-size="11">#infra</text>
  <text class="chip tiny dim" x="412" y="426">delivered</text>
  <rect class="panel" x="226" y="436" width="958" height="30" rx="6"/>
  <text class="txt" x="238" y="455">deploy of v2.1.0 finished — all health checks passing, rollout complete.</text>

  <!-- ===== composer ===== -->
  <rect class="panel" x="226" y="672" width="120" height="34" rx="8"/>
  <text class="dim" x="238" y="693">to (addr)</text>
  <rect class="panel" x="352" y="672" width="740" height="34" rx="8"/>
  <text class="dim" x="364" y="693">message — you sign as human@host</text>
  <rect x="1098" y="672" width="86" height="34" rx="8" fill="#21262d"/>
  <text class="dim" x="1141" y="693" text-anchor="middle">send</text>
</svg>
